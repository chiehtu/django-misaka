[project]
name = "django-misaka"
version = "0.3.0"
description = "A Django app for rendering Markdown (by Misaka Markdown parser)."
authors = [{ name = "Chieh Tu", email = "me@chiehtu.net" }]
requires-python = ">= 3.10, < 3.14"
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "misaka~=2.1.1",
    "Pygments~=2.15.1",
]

[project.urls]
Repository = "https://github.com/chiehtu/django-misaka"

[dependency-groups]
dev = [
    "coverage>=6.4.2,<7",
    "tox>=4,<5",
    "Django>=5,<6 ; python_version >= '3.10' and python_version < '3.14'",
    "pre-commit>=4.2.0,<5",
    "pytest>=8,<9",
    "pytest-django>=4.5.2,<5",
    "pytest-xdist~=3.6",
    "ruff>=0,<1",
]

[tool.hatch.build.targets.sdist]
include = ["CHANGELOG.md"]
exclude = ["django_misaka/tests.py"]

[tool.hatch.build.targets.wheel]
include = ["CHANGELOG.md"]
exclude = ["django_misaka/tests.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
parallel = true
